# `@netlify/database` in deps auto-provisions Postgres and applies the migrations
# in netlify/database/migrations at deploy time. Set AGENT_ADMIN_KEY in the site
# env — it's the deploy-time root secret; the connection token clients actually
# use is minted from it via the admin-gated UI (see README).
[build]
  publish = "public"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[template.environment]
  AGENT_ADMIN_KEY = "Deploy-time root secret for this agent. Only the deployer knows it. Used to unlock the admin UI at the deployed site, which reveals the connection token that clients (e.g. the desktop app) use to talk to the agent. Set this to a long, random value."
  OPENROUTER_API_KEY = "An OpenRouter API key (https://openrouter.ai/keys). Used to run this agent's LLM turns — without it, POST /message cannot call the model."
